<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backlink Assembly Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      color: var(--color-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      max-width: 60ch;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · FameNinja Off-Page Ops</p>
    <h1>Backlink Assembly Line</h1>
    <p class="sub">Ek batch = 10 sites. Team login karti hai, Claude packs bhar ke submit karta hai, sheet backend har link ka time aur status yaad rakhti hai, validator quality check karta hai — aur loop agle dispatch pe chal padta hai.</p>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="assembly-line-title assembly-line-desc">
      <title id="assembly-line-title">Backlink Assembly Line</title>
      <desc id="assembly-line-desc">Swimlane showing the batch loop: Claude prepares a dispatch of ten sites and packs, the sheet queues it, the team logs in to the sites, Claude fills and submits the packs in the logged-in tabs, live URLs and timing land in the sheet, the validator writes verdicts back, and the next dispatch is announced to the team.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="24" y1="112" x2="976" y2="112" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="24" y1="208" x2="976" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="24" y1="304" x2="976" y2="304" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="24" y1="400" x2="976" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Lane labels -->
      <text x="12" y="68" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TEAM</text>
      <text x="12" y="164" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CLAUDE</text>
      <text x="12" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SHEETS</text>
      <text x="12" y="356" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VALIDATOR</text>

      <!-- ============ ARROWS (drawn before nodes) ============ -->

      <!-- A1: Dispatch Prep -> Dispatch Tab -->
      <path d="M120,188 V248 Q120,256 128,256 H216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="148" y="236" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="172" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE</text>

      <!-- A2: Dispatch Prep -> Login x10 (notify team with URL list) -->
      <path d="M144,132 V72 Q144,64 152,64 H344" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="196" y="44" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="53" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">URL LIST · TG</text>

      <!-- A3: Login x10 -> Fill + Submit (the handoff, accent) -->
      <path d="M400,92 V152 Q400,160 408,160 H472" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="408" y="116" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="125" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BATCH READY</text>

      <!-- A4: Fill + Submit -> Sheet Update -->
      <path d="M504,188 V248 Q504,256 512,256 H600" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="532" y="236" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIVE URL</text>

      <!-- A5: Sheet Update -> QA Check -->
      <path d="M632,284 V344 Q632,352 640,352 H728" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="664" y="332" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK</text>

      <!-- A6: QA Check -> Sheet Update (verdict writeback, dashed return) -->
      <path d="M784,324 V280 Q784,272 776,272 H712" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="720" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>

      <!-- A7: Sheet Update -> Next Dispatch -->
      <path d="M656,228 V168 Q656,160 664,160 H856" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="732" y="140" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BATCH DONE</text>

      <!-- A8: Next Dispatch -> Login x10 (loop, dashed) -->
      <path d="M912,132 V32 Q912,24 904,24 H408 Q400,24 400,32 V36" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="628" y="4" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="13" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT BATCH</text>

      <!-- ============ NODES ============ -->

      <!-- N3: Login x10 (TEAM) -->
      <rect x="344" y="36" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="36" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Login ×10</text>
      <text x="400" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signup + captcha</text>

      <!-- N1: Dispatch Prep (CLAUDE) -->
      <rect x="88" y="132" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="132" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatch Prep</text>
      <text x="144" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shortlist + packs</text>

      <!-- N4: Fill + Submit (CLAUDE, focal) -->
      <rect x="472" y="132" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="132" width="112" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="528" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fill + Submit</text>
      <text x="528" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30-60 sec / site</text>

      <!-- N7: Next Dispatch (CLAUDE) -->
      <rect x="856" y="132" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="132" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="912" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next Dispatch</text>
      <text x="912" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">telegram → team</text>

      <!-- N2: Dispatch Tab (SHEETS) -->
      <rect x="216" y="228" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="228" width="112" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="272" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatch Tab</text>
      <text x="272" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batch #N · QUEUED</text>

      <!-- N5: Sheet Update (SHEETS) -->
      <rect x="600" y="228" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="228" width="112" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="656" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sheet Update</text>
      <text x="656" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">live url + timing</text>

      <!-- N6: QA Check (VALIDATOR) -->
      <rect x="728" y="324" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="324" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="784" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QA Check</text>
      <text x="784" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">live-validator</text>

      <!-- ============ LEGEND ============ -->
      <line x1="24" y1="424" x2="976" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="96" y="436" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="116" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HUMAN STEP</text>

      <rect x="216" y="436" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="236" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CLAUDE / BOT STEP</text>

      <rect x="384" y="436" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="404" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SHEET STATE</text>

      <rect x="520" y="436" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="540" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NAYA AUTO STEP</text>

      <line x1="672" y1="442" x2="700" y2="442" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="708" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN / LOOP</text>
    </svg>
  </div>
</body>
</html>
